<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Sport Bingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-[#0f172a] min-h-screen flex flex-col items-center py-4 px-4 font-sans text-slate-200 overflow-x-hidden">

    <div id="menuScreen" class="relative max-w-md w-full bg-[#1e293b] rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/5 view-transition">
        <header class="text-center mb-8 sm:mb-10">
            <h1 class="text-4xl sm:text-5xl font-black tracking-tighter text-white mb-2 italic text-center uppercase">Sports Bingo</h1>
            <p class="text-slate-400 text-sm">Select a category to play! :]</p>
        </header>

        <div class="space-y-3 sm:space-y-4 mb-4">
            <button onclick="startGame('soccer')" class="w-full group flex items-center justify-between bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-black py-4 sm:py-6 px-6 sm:px-8 rounded-2xl transition-all shadow-xl hover:scale-[1.02]">
                <span class="text-xl sm:text-2xl uppercase tracking-wider">Soccer</span>
                <span class="text-2xl sm:text-3xl group-hover:rotate-12 transition-transform">⚽</span>
            </button>
            <button onclick="startGame('f1')" class="w-full group flex items-center justify-between bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 font-black py-4 sm:py-6 px-6 sm:px-8 rounded-2xl transition-all shadow-xl hover:scale-[1.02]">
                <span class="text-xl sm:text-2xl uppercase tracking-wider">Formula 1</span>
                <span class="text-2xl sm:text-3xl group-hover:rotate-12 transition-transform filter drop-shadow-md">🏎️</span>
            </button>
            <button onclick="startGame('hockey')" class="w-full group flex items-center justify-between bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 font-black py-4 sm:py-6 px-6 sm:px-8 rounded-2xl transition-all shadow-xl hover:scale-[1.02]">
                <span class="text-xl sm:text-2xl uppercase tracking-wider">Hockey</span>
                <span class="text-2xl sm:text-3xl group-hover:rotate-12 transition-transform">🏒</span>
            </button>
        </div>

        <div class="absolute bottom-4 left-6 text-[10px] italic text-slate-500 uppercase tracking-widest opacity-50">
            Version 1.6
        </div>
    </div>

    <div id="gameScreen" class="max-w-xl w-full bg-[#1e293b] rounded-3xl shadow-2xl p-4 sm:p-6 border border-white/5 hidden view-transition">
        <header class="flex justify-between items-center mb-4 sm:mb-6">
            <div>
                <h2 id="gameTitle" class="text-2xl sm:text-3xl font-black text-white uppercase italic tracking-tight">Soccer</h2>
                <p class="text-slate-400 text-[10px] sm:text-xs font-medium">Click a tile to mark it!</p>
            </div>
            <button onclick="showMenu()" class="text-slate-400 hover:text-white transition-colors bg-white/5 p-2 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6_w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z" />
                </svg>
            </button>
        </header>

        <div class="mb-6 sm:mb-8">
            <div id="bingoBoard" class="bingo-grid">
                <!-- Grid will be generated by JS -->
            </div>
        </div>

        <div class="flex gap-3 sm:gap-4 mb-8">
            <button id="newCardBtn" onclick="requestConfirmation('newCardBtn', generateNewCard, 'New Card')" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-3 sm:py-4 px-2 rounded-xl sm:rounded-2xl transition-all border border-white/10 text-sm sm:text-base active:scale-95 overflow-hidden">
                New Card
            </button>
            <button id="clearBtn" onclick="requestConfirmation('clearBtn', resetMarkers, 'Clear')" class="flex-1 bg-slate-700/50 hover:bg-slate-700 text-slate-200 font-bold py-3 sm:py-4 px-2 rounded-xl sm:rounded-2xl transition-all border border-white/10 text-sm sm:text-base active:scale-95 overflow-hidden">
                Clear
            </button>
        </div>

        <!-- History Section -->
        <div class="bg-black/20 rounded-2xl border border-white/5 p-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-3">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                    Match Log
                </h3>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <select id="tileSelector" onchange="handleDropdownMark(this)" class="flex-1 sm:flex-initial bg-[#2d3748] text-white text-xs rounded-lg border border-white/10 p-2 outline-none focus:ring-2 focus:ring-blue-500/50 transition-all cursor-pointer max-w-[200px]">
                        <option value="" disabled selected>Track event...</option>
                    </select>
                    <!-- Exclusions trigger button -->
                    <button onclick="toggleExclusionModal(true)" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-bold py-2 px-3 rounded-lg transition-all flex items-center gap-1 active:scale-95">
                        <span>🚫</span>
                        <span>Excludes...</span>
                    </button>
                </div>
            </div>
            <div id="matchLog" class="max-h-40 overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                <p id="emptyLogText" class="text-slate-600 text-xs italic text-center py-2">No events marked yet... 🥲</p>
            </div>
        </div>
    </div>

    <!-- Exclusion Modal -->
    <div id="exclusionModal" class="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4 backdrop-blur-sm hidden view-transition">
        <div class="bg-[#1e293b] border border-white/10 rounded-3xl max-w-lg w-full max-h-[85vh] flex flex-col p-6 shadow-2xl">
            <header class="flex justify-between items-center mb-4 pb-2 border-b border-white/5">
                <div>
                    <h3 class="text-lg font-black text-white uppercase tracking-tight flex items-center gap-2">
                        <span>🚫</span> Exclude Tiles
                    </h3>
                    <p class="text-[10px] text-slate-400">Select tiles you do not want on your bingo card.</p>
                </div>
                <button onclick="toggleExclusionModal(false)" class="text-slate-400 hover:text-white transition-colors bg-white/5 hover:bg-white/10 p-1.5 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </header>

            <!-- Exclusion Pool Stats -->
            <div class="bg-[#0f172a] rounded-xl p-3 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 border border-white/5">
                <div class="text-xs text-slate-300">
                    Excluded: <span id="excludedCount" class="font-bold text-red-400">0</span> | 
                    Remaining: <span id="remainingCount" class="font-bold text-emerald-400">0</span>
                </div>
                <div id="exclusionWarning" class="text-[10px] text-red-400 font-bold bg-red-500/10 px-2 py-1 rounded border border-red-500/20 hidden">
                    ⚠ Card needs 24 available tiles!
                </div>
            </div>

            <!-- List Grid -->
            <div id="exclusionList" class="grid grid-cols-2 sm:grid-cols-3 gap-2 overflow-y-auto max-h-[45vh] pr-1 custom-scrollbar">
                <!-- Populated via JS -->
            </div>

            <!-- Modal Actions -->
            <div class="flex gap-3 mt-6 pt-4 border-t border-white/5">
                <button onclick="clearAllExclusions()" class="flex-1 bg-slate-700/50 hover:bg-slate-700 text-slate-200 font-bold py-3 px-2 rounded-xl transition-all border border-white/5 text-xs uppercase tracking-wider active:scale-95">
                    Clear All
                </button>
                <button id="applyExclusionsBtn" onclick="applyExclusionsAndRefresh()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-2 rounded-xl transition-all border border-emerald-500/20 text-xs uppercase tracking-wider active:scale-95">
                    Refresh Card
                </button>
            </div>
        </div>
    </div>

    <div id="winMessage" class="hidden bg-[#52FF5C]/10 text-[#52FF5C] font-black px-6 sm:px-10 py-3 sm:py-5 rounded-xl sm:rounded-2xl shadow-[0_0_30px_rgba(82,255,92,0.4)] border border-[#52FF5C]/30 uppercase tracking-widest backdrop-blur-sm text-sm sm:text-base">
        Bingo! 🏆
    </div>
        <script src="./app.js" defer></script>
</body>
</html>
